@if (profile$ | async; as profile) {
  <app-header [name]="profile.name" />
  <main>
    <app-hero [profile]="profile" />
    <app-services [services]="profile.services" />
    <app-skills [skills]="profile.skills" />
    <app-experience [experience]="profile.experience" />
    <app-education [education]="profile.education" />
    <app-certifications [certifications]="profile.certifications" />
    <app-projects [projects]="profile.projects" />
    <app-contact [profile]="profile" />
  </main>
  <app-footer [name]="profile.name" />
} @else {
  <p class="loading">Cargando...</p>
}
