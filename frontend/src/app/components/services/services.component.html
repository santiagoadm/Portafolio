<section id="servicios">
  <div class="container">
    <div class="section-title">
      <span>02.</span>
      <h2>Qué hago</h2>
    </div>
    <div class="grid cards">
      @for (service of services; track service.title) {
        <article class="card">
          <h3>{{ service.title }}</h3>
          <p class="muted">{{ service.description }}</p>
        </article>
      }
    </div>
  </div>
</section>
